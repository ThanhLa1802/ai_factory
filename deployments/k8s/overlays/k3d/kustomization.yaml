apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-factory
resources:
  - ../../base
  - ingress.yaml
# Local images built on the host and loaded into k3d with `k3d image import`.
# imagePullPolicy: IfNotPresent is set in the base manifests.
images:
  - name: ai-factory/server
    newTag: dev
  - name: ai-factory/worker
    newTag: dev
  - name: ai-factory/web
    newTag: dev
