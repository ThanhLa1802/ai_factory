apiVersion: v1
kind: Secret
metadata:
  name: ai-factory-secrets
type: Opaque
stringData:
  # Dev-only defaults — override via an overlay/secretGenerator for anything real.
  database-url: "postgres://ai_factory:ai_factory@postgres:5432/ai_factory?sslmode=disable"
  jwt-secret: "dev-secret-change-me-0123456789"
  # Optional: HF token for gated models (leave empty for ungated Qwen).
  hf-token: ""
