# AI Factory — default configuration. AI_FACTORY_* env vars override these.
database_url: "postgres://ai_factory:ai_factory@localhost:5432/ai_factory?sslmode=disable"
jwt_secret: "dev-secret-change-me"
log_level: "info"
kafka_addr: "localhost:9092"
redis_addr: "localhost:6379"
rate_limit_rpm: 60
rate_limit_concurrency: 4
# Batch Slot count (BatchScheduler). >1 lets requests queue up at the worker
# while others decode (continuous batching); the worker runs one forward pass
# at a time. Env: AI_FACTORY_INFERENCE_MAX_IN_FLIGHT_BATCHES.
inference:
  max_in_flight_batches: 4
# Resource budgets (C4). Bound the Postgres pool and HTTP idle/read timeouts.
# http_write_timeout is intentionally unset (0) — SSE streams must not be killed.
database_max_open_conns: 25
database_max_idle_conns: 25
database_conn_max_lifetime: "30m"
database_conn_max_idle_time: "5m"
http_read_header_timeout: "10s"
http_idle_timeout: "120s"
# Roles this process runs. cmd/server defaults to both; cmd/worker forces
# api=false. Override with AI_FACTORY_SERVICES_API / AI_FACTORY_SERVICES_WORKER.
services:
  api: true
  worker: true
  billing: true
# Prepaid billing. mode: off | shadow | enforce. Money is integer micro-credits
# (1 currency unit = 1,000,000 µcr); model_pricing stores µcr per 1M tokens.
billing:
  mode: "shadow"
  currency: "USD"
  initial_allowance: 0
  reservation_ttl: "15m"
  reaper_interval: "1m"
# Built-in tool execution. executor: local | docker. "docker" runs every tool in
# a throwaway container (--network=none --read-only --cap-drop=ALL, workspace
# bind-mounted at /workspace). Env: AI_FACTORY_TOOLS_EXECUTOR /
# AI_FACTORY_TOOLS_DOCKER_IMAGE. Requires the docker CLI on PATH.
tools:
  executor: "local"
  docker_image: "alpine:3.24"
