[project]
name = "ai-factory-worker"
version = "0.1.0"
description = "Python inference worker for AI Factory"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "torch>=2.2.0",
    "transformers>=4.44.0",
    # diffusers >=0.36 pulls huggingface-hub >=1.0, which transformers 4.50
    # rejects. Pin below that cliff until transformers is upgraded in lockstep.
    "diffusers>=0.32.0,<0.36",
    "safetensors>=0.4.0",
    "Pillow>=10.0.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
    "httpx>=0.27",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
