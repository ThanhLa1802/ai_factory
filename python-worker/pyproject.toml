[project]
name = "ai-factory-worker"
version = "0.1.0"
description = "Python inference worker for AI Factory"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
